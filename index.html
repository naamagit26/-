        // --- VIEW 1: SALES PIPELINE (צנרת לידים) ---
        function LeadsPipelineView({ leads, setLeads, customers, setCustomers, companySettings, showToast, onOpenCustomerFile }) {
            const handleImportLeads = () => {
                const sampleLeads = [
                    { id: 'l_' + Date.now(), businessName: 'מסעדת ים תיכון', businessType: 'מסעדה', contactName: 'רונן', phone: '0549998877', region: 'מרכז', city: 'הרצליה', status: '1_new', notes: 'ייבוא אוטומטי מהרשת' },
                    { id: 'l_' + (Date.now() + 1), businessName: 'אטליז השוק', businessType: 'קצבייה', contactName: 'דוד', phone: '0526665544', region: 'דרום', city: 'באר שבע', status: '1_new', notes: 'ייבוא אוטומטי מהרשת' }
                ];
                setLeads(prev => [...prev, ...sampleLeads]);
                showToast('2 לידים חדשים יובאו בהצלחה לצינור המכירות!');
            };

            const handleSendPortalLink = (lead) => {
                const updatedLeads = leads.map(l => l.id === lead.id ? { ...l, status: '2_contacted', linkSent: true } : l);
                setLeads(updatedLeads);

                const targetPhone = lead.phone.replace(/[^0-9]/g, '');
                // Generate absolute real dynamic URL pointing to the live web app instance
                const livePortalUrl = window.location.href.split('?')[0].split('#')[0] + '?portal=true';
                const text = `היי ${lead.contactName}, מצורף קישור גישה אישי לפורטל ההזמנות הדיגיטלי של ${companySettings.companyName}. לצפייה בקטלוג וביצוע הזמנה:\n${livePortalUrl}`;
                
                window.open(`https://wa.me/972${targetPhone}?text=${encodeURIComponent(text)}`, '_blank');
                showToast(`קישור פורטל פעיל נשלח ל-${lead.businessName} והליד עודכן ל"נוצר קשר"!`);
            };

            const handleStatusChange = (leadId, newStatus) => {
                setLeads(prev => prev.map(l => l.id === leadId ? { ...l, status: newStatus } : l));
                showToast('סטטוס הליד עודכן בהצלחה');
            };

            const stages = [
                { id: '1_new', label: '1. כל הלידים החדשים', color: 'bg-amber-50 border-amber-200 text-amber-800' },
                { id: '2_contacted', label: '2. נוצר קשר', color: 'bg-blue-50 border-blue-200 text-blue-800' },
                { id: '3_active', label: '3. לקוח פעיל (התחבר למערכת)', color: 'bg-emerald-50 border-emerald-200 text-emerald-800' }
            ];

            return (
                <div className="space-y-6 dir-rtl text-xs">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                        <div>
                            <h2 className="text-xl font-black text-slate-900">צנרת לידים ומכירות (Sales Pipeline)</h2>
                            <p className="text-slate-500 font-bold mt-0.5">מעקב וניהול לידים פוטנציאליים לפי שלבי התקדמות</p>
                        </div>
                        <button 
                            onClick={handleImportLeads}
                            className="bg-wolt-500 hover:bg-wolt-600 text-white font-black px-5 py-2.5 rounded-2xl shadow transition flex items-center space-x-2 space-x-reverse text-xs"
                        >
                            <Icon name="plus" className="w-4 h-4" />
                            <span>ייבא לידים חדשים מהרשת</span>
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                        {stages.map(stg => {
                            const stageLeads = leads.filter(l => l.status === stg.id);
                            return (
                                <div key={stg.id} className="bg-slate-100 p-4 rounded-3xl border border-slate-200 flex flex-col min-h-[500px]">
                                    <div className={`p-3 rounded-2xl border font-black flex justify-between items-center mb-4 ${stg.color}`}>
                                        <span>{stg.label}</span>
                                        <span className="bg-white/80 px-2.5 py-0.5 rounded-full text-xs font-mono">{stageLeads.length}</span>
                                    </div>

                                    <div className="space-y-3 flex-1 overflow-y-auto">
                                        {stageLeads.map(lead => {
                                            const cust = customers.find(c => c.phone === lead.phone || c.businessName === lead.businessName);
                                            return (
                                                <div 
                                                    key={lead.id}
                                                    onClick={() => cust && onOpenCustomerFile(cust)}
                                                    className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition cursor-pointer space-y-3"
                                                >
                                                    <div className="flex justify-between items-start">
                                                        <div className="flex items-center space-x-2 space-x-reverse">
                                                            <div className="p-2 bg-wolt-50 text-wolt-600 rounded-xl">
                                                                <Icon name="folder" className="w-4 h-4" />
                                                            </div>
                                                            <div>
                                                                <h4 className="font-black text-slate-900 text-sm">{lead.businessName}</h4>
                                                                <span className="text-slate-500 font-bold text-[11px]">{lead.businessType} • {lead.city}</span>
                                                            </div>
                                                        </div>
                                                        {lead.linkSent && (
                                                            <span className="bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full text-[10px] font-black">נשלח קישור</span>
                                                        )}
                                                    </div>

                                                    <div className="text-slate-600 font-bold bg-slate-50 p-2 rounded-xl text-[11px]">
                                                        איש קשר: {lead.contactName} • {lead.phone}
                                                    </div>

                                                    <div className="flex items-center gap-2 pt-1 border-t border-slate-100" onClick={e => e.stopPropagation()}>
                                                        <a href={`tel:${lead.phone}`} className="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700" title="חייג">
                                                            <Icon name="phone" className="w-4 h-4" />
                                                        </a>
                                                        {lead.status !== '3_active' ? (
                                                            <button 
                                                                onClick={() => handleSendPortalLink(lead)}
                                                                className="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-black py-1.5 px-3 rounded-xl flex items-center justify-center space-x-1.5 space-x-reverse text-[11px]"
                                                            >
                                                                <Icon name="whatsapp" className="w-3.5 h-3.5" />
                                                                <span>שלח קישור פורטל</span>
                                                            </button>
                                                        ) : (
                                                            <div className="flex-1 bg-slate-100 text-slate-500 font-bold py-1.5 px-2 rounded-xl text-center text-[10px] flex items-center justify-center space-x-1 space-x-reverse">
                                                                <Icon name="check" className="w-3.5 h-3.5 text-emerald-600" />
                                                                <span>מחובר למערכת</span>
                                                            </div>
                                                        )}
                                                        <select 
                                                            value={lead.status}
                                                            onChange={(e) => handleStatusChange(lead.id, e.target.value)}
                                                            className="bg-slate-50 border text-[11px] font-bold p-1 rounded-xl"
                                                        >
                                                            <option value="1_new">חדש</option>
                                                            <option value="2_contacted">נוצר קשר</option>
                                                            <option value="3_active">לקוח פעיל</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // --- VIEW 2: CUSTOMER CRM & DETAILS ---
        function CustomerCRMView({ customers, setCustomers, selectedCustomerId, setSelectedCustomerId, orders, products, companySettings, showToast }) {
            const [searchTerm, setSearchTerm] = useState('');
            const selectedCustomer = useMemo(() => customers.find(c => c.id === selectedCustomerId), [customers, selectedCustomerId]);

            const filteredCustomers = useMemo(() => {
                return customers.filter(c => 
                    c.businessName.includes(searchTerm) || 
                    c.taxId.includes(searchTerm) || 
                    c.contactName.includes(searchTerm) || 
                    c.phone.includes(searchTerm)
                );
            }, [customers, searchTerm]);

            return (
                <div className="space-y-6 dir-rtl text-xs">
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* CUSTOMERS LIST SIDEBAR */}
                        <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                            <div className="flex justify-between items-center">
                                <h3 className="font-black text-slate-900 text-base">רשימת תיקי לקוחות ({filteredCustomers.length})</h3>
                            </div>

                            <div className="relative">
                                <input 
                                    type="text" 
                                    placeholder="חיפוש לפי שם עסק, ח.פ, איש קשר..."
                                    value={searchTerm}
                                    onChange={e => setSearchTerm(e.target.value)}
                                    className="w-full bg-slate-50 border rounded-2xl py-2.5 px-3 pr-9 font-bold text-slate-900 text-xs"
                                />
                                <Icon name="search" className="w-4 h-4 text-slate-400 absolute top-3 right-3" />
                            </div>

                            <div className="space-y-2.5 max-h-[600px] overflow-y-auto pr-1">
                                {filteredCustomers.map(cust => (
                                    <div 
                                        key={cust.id}
                                        onClick={() => setSelectedCustomerId(cust.id)}
                                        className={`p-4 rounded-2xl border transition cursor-pointer space-y-2 ${selectedCustomerId === cust.id ? 'bg-wolt-50 border-wolt-500 shadow-sm' : 'bg-slate-50 hover:bg-slate-100 border-slate-200'}`}
                                    >
                                        <div className="flex justify-between items-start">
                                            <h4 className="font-black text-slate-900 text-sm">{cust.businessName}</h4>
                                            {cust.isNewCustomer && (
                                                <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full text-[10px] font-black">לקוח חדש</span>
                                            )}
                                        </div>
                                        <div className="text-slate-500 font-bold text-[11px]">
                                            ח.פ: {cust.taxId} • איש קשר: {cust.contactName}
                                        </div>
                                        <div className="text-slate-700 font-mono text-[11px] font-bold">
                                            טלפון: {cust.phone}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* CUSTOMER FILE DETAIL DISPLAY */}
                        <div className="lg:col-span-2">
                            {selectedCustomer ? (
                                <CustomerFileDetail 
                                    customer={selectedCustomer}
                                    orders={orders.filter(o => o.customerId === selectedCustomer.id)}
                                    products={products}
                                    companySettings={companySettings}
                                    showToast={showToast}
                                />
                            ) : (
                                <div className="bg-white p-12 rounded-3xl border border-slate-200 text-center text-slate-400 font-bold space-y-3">
                                    <Icon name="folder" className="w-12 h-12 mx-auto text-slate-300" />
                                    <p className="text-base">בחר לקוח מהרשימה לצפייה בתיק הלקוח 360°</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function CustomerFileDetail({ customer, orders, products, companySettings, showToast }) {
            const [quoteModalOpen, setQuoteModalOpen] = useState(false);

            const creditPercent = Math.min(100, Math.round((customer.currentDebt / customer.creditLimit) * 100));

            return (
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6 dir-rtl text-xs">
                    {/* CUSTOMER HEADER INFO */}
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-5">
                        <div>
                            <div className="flex items-center space-x-2 space-x-reverse">
                                <h2 className="text-2xl font-black text-slate-900">{customer.businessName}</h2>
                                {customer.isNewCustomer && (
                                    <span className="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-black">לקוח חדש</span>
                                )}
                            </div>
                            <p className="text-slate-500 font-bold mt-1">ח.פ / ע.מ: {customer.taxId} • אזור חלוקה: {customer.region}</p>
                        </div>
                        <button 
                            onClick={() => setQuoteModalOpen(true)}

                        >
                            <Icon name="file-text" className="w-4 h-4" />
                            <span>הפק הצעת מחיר ב-PDF</span>
                        </button>
                    </div>

                    {/* PHONE HIGHLIGHT BOX */}
                    <div className="bg-wolt-50 p-4 rounded-2xl border border-wolt-200 flex flex-col sm:flex-row justify-between items-center gap-3">
                        <div className="flex items-center space-x-3 space-x-reverse">
                            <div className="p-3 bg-wolt-500 text-white rounded-2xl">
                                <Icon name="phone" className="w-6 h-6" />
                            </div>
                            <div>
                                <span className="text-wolt-700 font-black text-xs block">טלפון:</span>
                                <span className="text-slate-900 font-black text-lg font-mono">{customer.phone}</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <a

                                className="bg-wolt-500 hover:bg-wolt-600 text-white font-black px-4 py-2 rounded-xl text-xs flex items-center space-x-1.5 space-x-reverse shadow"
                            >
                                <Icon name="phone" className="w-4 h-4" />
                                <span>חייג עכשיו</span>
                            </a>
                            <a 
                                href={`https://wa.me/972${customer.phone.replace(/[^0-9]/g, '')}`}
                                target="_blank"
                                className="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-4 py-2 rounded-xl text-xs flex items-center space-x-1.5 space-x-reverse shadow"
                            >
                                <Icon name="whatsapp" className="w-4 h-4" />
                                <span>WhatsApp</span>
                            </a>
                        </div>
                    </div>

                    {/* CREDIT & DETAILS GRID */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
                            <span className="text-slate-500 font-bold block">מסגרת אשראי וחוב:</span>
                            <div className="flex justify-between font-mono font-black text-slate-900 text-sm">
                                <span>חוב: ₪{customer.currentDebt.toLocaleString()}</span>
                                <span>תקרה: ₪{customer.creditLimit.toLocaleString()}</span>
                            </div>
                            <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                                <div className={`h-full ${creditPercent > 80 ? 'bg-rose-500' : 'bg-wolt-500'}`} style={{ width: `${creditPercent}%` }}></div>

                            <span className="text-slate-500 font-bold block">איש קשר וכתובת:</span>
                            <span className="font-black text-slate-900 text-xs block">{customer.contactName}</span>

        // --- VIEW 3: INACTIVE CUSTOMERS (לקוחות לא פעילים) ---
        function InactiveCustomersView({ customers, onOpenCustomerFile }) {
            const inactiveCustomers = useMemo(() => {
                return customers.filter(c => {
                    if (!c.lastOrderDate) return true;
                    const diffDays = Math.floor((new Date() - new Date(c.lastOrderDate)) / (1000 * 60 * 60 * 24));
                    return diffDays >= 35;
                });
            }, [customers]);

            return (
                <div className="space-y-6 dir-rtl text-xs">
                    <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                        <h2 className="text-xl font-black text-slate-900">לקוחות לא פעילים (למעלה מ-35 יום ללא הזמנה)</h2>
                        <p className="text-slate-500 font-bold mt-1">מערכת זיהוי אוטומטית לפנייה ושימור לקוחות</p>
                    </div>

                                    איש קשר: {cust.contactName} • טלפון: {cust.phone}

        // --- VIEW 4: CATALOG & KASHRUT MANAGEMENT ---
        function CatalogManagementView({ products, setProducts, kashrutCerts, setKashrutCerts, showToast }) {
            const [editingProduct, setEditingProduct] = useState(null);
            const [showKashrutPanel, setShowKashrutPanel] = useState(false);
            const [productImageUrl, setProductImageUrl] = useState('');

            // State for adding new Kashrut Cert
            const [newCertName, setNewCertName] = useState('');
            const [newCertAuthority, setNewCertAuthority] = useState('');
            const [newCertExpiry, setNewCertExpiry] = useState('');
            const [newCertImageUrl, setNewCertImageUrl] = useState('');

            useEffect(() => {
                if (editingProduct) {
                    setProductImageUrl(editingProduct.imageUrl || '');
                } else {
                    setProductImageUrl('');
                }
            }, [editingProduct]);

            const handleImageFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setProductImageUrl(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleCertImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setNewCertImageUrl(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAddKashrutCert = (e) => {
                e.preventDefault();
                if (!newCertName || !newCertAuthority) {
                    showToast('נא למלא שם כשרות וגוף מעניק!');
                    return;
                }
                const newCert = {
                    id: 'k' + Date.now(),
                    name: newCertName,
                    authority: newCertAuthority,
                    expiryDate: newCertExpiry || '2028-12-31',
                    imageUrl: newCertImageUrl || 'https://placehold.co/600x800/f8fafc/0f172a?text=KASHRUT+CERT'
                };
                setKashrutCerts(prev => [...prev, newCert]);
                setNewCertName('');
                setNewCertAuthority('');
                setNewCertExpiry('');
                setNewCertImageUrl('');
                showToast('תעודת כשרות חדשה נוספה בהצלחה!');
            };

            const handleDeleteKashrutCert = (certId) => {
                setKashrutCerts(prev => prev.filter(c => c.id !== certId));
                showToast('תעודת הכשרות הוסרה מהמערכת');
            };

            const handleSaveProduct = (e) => {
                e.preventDefault();
                const form = e.target;
                const finalImg = productImageUrl || 'https://placehold.co/400x300/009DE0/ffffff?text=MEAT';
                const updated = {
                    id: editingProduct ? editingProduct.id : 'p' + Date.now(),
                    name: form.name.value,
                    cutNumber: form.cutNumber.value,
                    category: form.category.value,
                    pricePerKg: parseFloat(form.pricePerKg.value),
                    salePricePerKg: parseFloat(form.salePricePerKg.value || form.pricePerKg.value),
                    isOnSale: form.isOnSale.checked,
                    kosherName: form.kosherName.value,
                    stockKg: parseFloat(form.stockKg.value || 0),
                    imageUrl: finalImg
                };

                if (editingProduct) {
                    setProducts(prev => prev.map(p => p.id === editingProduct.id ? updated : p));
                    showToast('המוצר עודכן בהצלחה!');
                } else {
                    setProducts(prev => [...prev, updated]);
                    showToast('מוצר חדש נוסף לקטלוג!');
                }
                setEditingProduct(null);
                setProductImageUrl('');
                form.reset();
            };

            const toggleSale = (prodId) => {
                setProducts(prev => prev.map(p => p.id === prodId ? { ...p, isOnSale: !p.isOnSale } : p));
                showToast('סטטוס מבצע עודכן!');
            };

            return (
                <div className="space-y-6 dir-rtl text-xs">
                    <div className="flex justify-between items-center bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">

                            <h2 className="text-xl font-black text-slate-900">ניהול קטלוג מוצרים ומבצעים</h2>
                            <p className="text-slate-500 font-bold mt-1">שליטה במחירים, מבצעים, כשרות ומלאי זמין בק"ג</p>

                        <button 
                            onClick={() => setShowKashrutPanel(!showKashrutPanel)}

                            {showKashrutPanel ? 'סגור תעודות כשרות ✕' : 'תעודות כשרות ספק 📜'}

                    </div>

                    {/* KASHRUT CERTIFICATES MANAGEMENT PANEL */}

                                <span className="text-slate-500 font-bold text-xs">תעודות פעילות: {kashrutCerts.length}</span>
                            </div>

                            {/* ADD NEW KASHRUT CERT FORM */}
                            <form onSubmit={handleAddKashrutCert} className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div>
                                        <label className="font-bold text-slate-700 block mb-1">שם הכשרות:</label>
                                        <input 
                                            type="text" 
                                            value={newCertName} 
                                            onChange={e => setNewCertName(e.target.value)} 
                                            required 
                                            placeholder={'לדוגמה: תעודת כשרות בד"ץ עטרה'} 
                                            className="w-full border p-2 rounded-xl font-bold bg-white text-xs" 
                                        />
                                    </div>
                                    <div>
                                        <label className="font-bold text-slate-700 block mb-1">גוף מעניק הכשרות:</label>
                                        <input 
                                            type="text" 
                                            value={newCertAuthority} 
                                            onChange={e => setNewCertAuthority(e.target.value)} 
                                            required 
                                            placeholder={'לדוגמה: בד"ץ עטרה'} 
                                            className="w-full border p-2 rounded-xl font-bold bg-white text-xs" 
                                        />
                                    </div>
                                    <div>
                                        <label className="font-bold text-slate-700 block mb-1">תוקף התעודה:</label>
                                        <input 
                                            type="date" 
                                            value={newCertExpiry} 
                                            onChange={e => setNewCertExpiry(e.target.value)} 
                                            className="w-full border p-2 rounded-xl font-bold bg-white text-xs font-mono" 
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="font-bold text-slate-700 block mb-1">תמונת התעודה (העלאת קובץ או קישור URL):</label>
                                    <div className="flex flex-col sm:flex-row gap-2 items-center">
                                        <input 
                                            type="file" 
                                            accept="image/*" 
                                            onChange={handleCertImageUpload} 
                                            className="w-full sm:w-auto text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-wolt-50 file:text-wolt-600 cursor-pointer" 
                                        />
                                        <input 
                                            type="text" 
                                            value={newCertImageUrl} 
                                            onChange={e => setNewCertImageUrl(e.target.value)} 
                                            placeholder="או הדבק קישור URL לתמונה..." 
                                            className="w-full sm:flex-1 border p-2 rounded-xl font-bold bg-white text-xs" 
                                        />
                                    </div>
                                    {newCertImageUrl && (
                                        <div className="mt-2 flex items-center gap-2 bg-white p-2 rounded-xl border">
                                            <img src={newCertImageUrl} className="w-10 h-10 object-cover rounded-lg border" />
                                            <span className="text-slate-500 text-[11px] font-bold">תצוגה מקדימה לתעודה</span>
                                        </div>
                                    )}
                                </div>

                                <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-5 py-2 rounded-xl text-xs shadow transition">
                                    + הוסף תעודת כשרות לקטלוג
                                </button>
                            </form>

                            {/* LIST OF EXISTING CERTS WITH DELETE BUTTON */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                {kashrutCerts.map(cert => (
                                    <div key={cert.id} className="p-4 border rounded-2xl bg-slate-50 flex items-center justify-between space-x-3 space-x-reverse">
                                        <div className="flex items-center space-x-3 space-x-reverse">
                                            <img src={cert.imageUrl} className="w-16 h-16 object-cover rounded-xl border bg-white" />
                                            <div>
                                                <h4 className="font-black text-slate-900 text-sm">{cert.name}</h4>
                                                <span className="text-slate-500 font-bold text-xs block">{cert.authority}</span>
                                                <span className="text-emerald-600 font-mono text-[11px] block font-bold">תוקף: {cert.expiryDate}</span>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => handleDeleteKashrutCert(cert.id)} 
                                            className="p-2 text-rose-500 hover:bg-rose-50 rounded-full transition" 
                                            title="מחק תעודה"
                                        >
                                            <Icon name="trash" className="w-4 h-4" />
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* PRODUCT EDIT FORM */}
                    <form onSubmit={handleSaveProduct} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                        <h3 className="font-black text-slate-900 text-base">{editingProduct ? 'עריכת מוצר בקטלוג' : 'הוספת מוצר חדש לקטלוג'}</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                            <div>
                                <label className="font-bold text-slate-700 block mb-1">שם המוצר:</label>
                                <input name="name" defaultValue={editingProduct?.name || ''} required className="w-full border p-2.5 rounded-xl font-bold bg-slate-50" placeholder="שם הנתח" />
                            </div>
                            <div>
                                <label className="font-bold text-slate-700 block mb-1">מספר נתח:</label>
                                <input name="cutNumber" defaultValue={editingProduct?.cutNumber || ''} required className="w-full border p-2.5 rounded-xl font-bold bg-slate-50" placeholder="מספר נתח" />
                            </div>
                            <div>
                                <label className="font-bold text-slate-700 block mb-1">קטגוריה:</label>
                                <select name="category" defaultValue={editingProduct?.category || 'בקר טרי'} className="w-full border p-2.5 rounded-xl font-bold bg-slate-50">
                                    <option value="בקר טרי">בקר טרי</option>
                                    <option value="טלה וכבש">טלה וכבש</option>
                                    <option value="עוף והודו">עוף והודו</option>
                                </select>
                            </div>
                            <div>
                                <label className="font-bold text-slate-700 block mb-1">גוף כשרות (מתוך התעודות המאושרות):</label>
                                <select 
                                    name="kosherName" 
                                    key={editingProduct ? editingProduct.id + '_kosher' : 'new_kosher'}
                                    defaultValue={editingProduct?.kosherName || (kashrutCerts[0]?.name || 'בד"ץ העדה החרדית')} 
                                    className="w-full border p-2.5 rounded-xl font-bold bg-slate-50"
                                >
                                    {kashrutCerts.map(cert => (
                                        <option key={cert.id} value={cert.name}>{cert.name}</option>
                                    ))}
                                    {!kashrutCerts.some(c => c.name === 'בד"ץ העדה החרדית') && <option value='בד"ץ העדה החרדית'>בד"ץ העדה החרדית</option>}
                                    {!kashrutCerts.some(c => c.name === 'בד"ץ בית יוסף') && <option value='בד"ץ בית יוסף'>בד"ץ בית יוסף</option>}
                                    {!kashrutCerts.some(c => c.name === 'רבנות מהדרין') && <option value='רבנות מהדרין'>רבנות מהדרין</option>}
                                </select>
                            </div>
                            <div>
                                <label className="font-bold text-slate-700 block mb-1">מחיר רגיל לק"ג (₪):</label>
                                <input type="number" step="0.1" name="pricePerKg" defaultValue={editingProduct?.pricePerKg || ''} required className="w-full border p-2.5 rounded-xl font-bold bg-slate-50 font-mono" />
                            </div>
                            <div>
                                <label className="font-bold text-slate-700 block mb-1">מחיר מבצע לק"ג (₪):</label>
                                <input type="number" step="0.1" name="salePricePerKg" defaultValue={editingProduct?.salePricePerKg || ''} className="w-full border p-2.5 rounded-xl font-bold bg-slate-50 font-mono" />
                            </div>
                            <div>
                                <label className="font-bold text-slate-700 block mb-1">מלאי זמין (ק"ג):</label>
                                <input type="number" name="stockKg" defaultValue={editingProduct?.stockKg || 100} className="w-full border p-2.5 rounded-xl font-bold bg-slate-50 font-mono" />
                            </div>
                            <div className="flex items-center space-x-2 space-x-reverse pt-6">
                                <input type="checkbox" name="isOnSale" defaultChecked={editingProduct?.isOnSale || false} className="w-5 h-5 rounded" />
                                <label className="font-black text-rose-600">סמן מוצר במבצע</label>
                            </div>

                            {/* PRODUCT IMAGE UPLOAD / URL FIELD */}
                            <div className="sm:col-span-4 border-t pt-3">
                                <label className="font-bold text-slate-700 block mb-1">תמונת המוצר (העלאת קובץ תמונה אמיתי או קישור URL):</label>
                                <div className="flex flex-col sm:flex-row gap-2 items-center">
                                    <input 
                                        type="file" 
                                        accept="image/*" 
                                        onChange={handleImageFileUpload}
                                        className="w-full sm:w-auto text-xs text-slate-500 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-wolt-50 file:text-wolt-600 hover:file:bg-wolt-100 cursor-pointer"
                                    />
                                    <input 
                                        type="text" 
                                        value={productImageUrl} 
                                        onChange={e => setProductImageUrl(e.target.value)} 
                                        placeholder="או הדבק קישור URL לתמונה..." 
                                        className="w-full sm:flex-1 border p-2.5 rounded-xl font-bold bg-slate-50 text-xs"
                                    />
                                </div>
                                {productImageUrl && (
                                    <div className="mt-2 flex items-center gap-3 bg-slate-50 p-2 rounded-xl border border-slate-200">
                                        <img src={productImageUrl} alt="תצוגה מקדימה" className="w-12 h-12 object-cover rounded-lg border" />
                                        <span className="text-slate-500 text-[11px] font-bold">תצוגה מקדימה לתמונת המוצר</span>
                                        <button type="button" onClick={() => setProductImageUrl('')} className="text-rose-500 font-bold text-xs mr-auto">הסר תמונה</button>
                                    </div>
                                )}
                            </div>
                        </div>
                        <div className="flex gap-2 border-t pt-3">
                            <button type="submit" className="bg-wolt-500 hover:bg-wolt-600 text-white font-black px-6 py-2.5 rounded-full text-xs shadow">
                                {editingProduct ? 'עדכן מוצר' : '+ הוסף מוצר לקטלוג'}
                            </button>
                            {editingProduct && (
                                <button type="button" onClick={() => { setEditingProduct(null); setProductImageUrl(''); }} className="bg-slate-200 text-slate-800 font-black px-4 py-2.5 rounded-full text-xs">
                                    ביטול
                                </button>
                            )}
                        </div>
                    </form>

                    {/* PRODUCTS GRID */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">

                            return (
                                <div key={prod.id} className={`bg-white p-4 rounded-3xl border shadow-sm space-y-3 ${prod.isOnSale ? 'border-rose-300' : 'border-slate-200'}`}>
                                    <div className="relative h-36 rounded-2xl overflow-hidden bg-slate-100">
                                        <img src={prod.imageUrl} className="w-full h-full object-cover" />

                                            <span className="absolute top-2 right-2 bg-rose-600 text-white font-black px-2.5 py-0.5 rounded-full text-[10px]">

        // --- VIEW 8: CUSTOMER PORTAL (WOLT STYLE STOREFRONT) ---
        function CustomerPortalView({ products, kashrutCerts, orders, setOrders, currentUser, companySettings, customers, setCustomers, drivers = [], showToast }) {
            const [selectedCategory, setSelectedCategory] = useState('הכל');
            const [cart, setCart] = useState([]);
            const [selectedKosherCert, setSelectedKosherCert] = useState(null);
            const [deliveryNotes, setDeliveryNotes] = useState('');
            const [requestedDeliveryDate, setRequestedDeliveryDate] = useState(new Date(Date.now() + 86400000).toISOString().split('T')[0]);
            const [currentSaleSlide, setCurrentSaleSlide] = useState(0);

            const saleProducts = useMemo(() => products.filter(p => p.isOnSale), [products]);

            const nextSaleSlide = () => {
                if (saleProducts.length === 0) return;
                setCurrentSaleSlide(prev => (prev + 1) % saleProducts.length);
            };

            const prevSaleSlide = () => {
                if (saleProducts.length === 0) return;
                setCurrentSaleSlide(prev => (prev - 1 + saleProducts.length) % saleProducts.length);
            };

            const filteredProducts = useMemo(() => {
                if (selectedCategory === 'הכל') return products;
                return products.filter(p => p.category === selectedCategory);
            }, [products, selectedCategory]);

            const addToCart = (prod) => {
                if (prod.stockKg <= 0) {
                    showToast('מוצר זה אזל מהמלאי!');
                    return;
                }
                setCart(prev => {
                    const existing = prev.find(i => i.id === prod.id);
                    if (existing) {
                        return prev.map(i => i.id === prod.id ? { ...i, weightKg: i.weightKg + 5 } : i);
                    }
                    return [...prev, { ...prod, weightKg: prod.minOrderKg || 5 }];
                });
                showToast(`נוספו 5 ק"ג מ-${prod.name} לסל!`);
            };

            const updateCartQuantity = (prodId, delta) => {
                setCart(prev => {
                    return prev.map(i => {
                        if (i.id === prodId) {
                            const newWeight = i.weightKg + delta;
                            return newWeight > 0 ? { ...i, weightKg: newWeight } : null;
                        }
                        return i;
                    }).filter(Boolean);
                });
            };

            const removeFromCart = (prodId) => {
                setCart(prev => prev.filter(i => i.id !== prodId));
            };

            const totalAmount = useMemo(() => {
                return cart.reduce((sum, item) => {
                    const price = item.isOnSale ? item.salePricePerKg : item.pricePerKg;
                    return sum + (price * item.weightKg);
                }, 0);
            }, [cart]);

            const totalWeight = useMemo(() => {
                return cart.reduce((sum, item) => sum + item.weightKg, 0);
            }, [cart]);

            const handleCheckout = () => {
                if (cart.length === 0) return;
                const newOrder = {
                    id: 'ORD-' + Math.floor(100 + Math.random() * 900),
                    customerId: 'c1',
                    customerName: currentUser.name,
                    orderDate: new Date().toISOString().split('T')[0],
                    deliveryDate: requestedDeliveryDate,
                    status: 'בליקוט',
                    totalAmount: totalAmount,
                    notes: deliveryNotes,
                    items: cart.map(i => ({ name: i.name, weightKg: i.weightKg, pricePerKg: i.isOnSale ? i.salePricePerKg : i.pricePerKg, total: (i.isOnSale ? i.salePricePerKg : i.pricePerKg) * i.weightKg }))
                };
                setOrders(prev => [newOrder, ...prev]);
                setCart([]);
                setDeliveryNotes('');
                showToast('הזמנתך התקבלה בהצלחה ותועבר לליקוט!');
            };

            return (
                <div className="space-y-6 dir-rtl text-xs">
                    {/* STORE BANNER */}
                    <div className="bg-gradient-to-r from-wolt-600 to-wolt-500 rounded-3xl p-6 text-white shadow-md flex justify-between items-center">
                        <div className="space-y-2">
                            <span className="bg-white/20 text-white font-black px-3 py-1 rounded-full text-xs inline-block">פורטל הזמנות B2B</span>
                            <h2 className="text-2xl font-black">ברוכים הבאים ל- {companySettings.companyName}</h2>
                            <p className="font-bold text-wolt-50">הזמנת נתחי בשר פרימיום טריים בהספקה ישירה עד העסק</p>
                        </div>
                    </div>

                    {/* PROMOTIONAL SALE CAROUSEL ABOVE CATALOG */}
                    {saleProducts.length > 0 && (
                        <div className="bg-slate-900 rounded-3xl p-5 text-white shadow-lg space-y-4 border border-slate-800 relative overflow-hidden">
                            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                <div className="flex items-center space-x-2 space-x-reverse">
                                    <span className="flex h-3 w-3 relative">
                                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                                        <span className="relative inline-flex rounded-full h-3 w-3 bg-rose-500"></span>
                                    </span>
                                    <h3 className="font-black text-base sm:text-lg text-white">מבצעים חמים ונתחים במחירי חיסול</h3>
                                    <span className="bg-rose-500/20 text-rose-300 font-bold px-2.5 py-0.5 rounded-full text-[11px]">
                                        {saleProducts.length} מוצרים במבצע
                                    </span>
                                </div>
                                <div className="flex items-center space-x-2 space-x-reverse">
                                    <button 
                                        onClick={prevSaleSlide}
                                        className="p-2 bg-slate-800 hover:bg-slate-700 text-white rounded-full transition shadow-xs"
                                        title="מבצע קודם"
                                    >
                                        <Icon name="chevron-right" className="w-4 h-4" />
                                    </button>
                                    <button 
                                        onClick={nextSaleSlide}
                                        className="p-2 bg-slate-800 hover:bg-slate-700 text-white rounded-full transition shadow-xs"
                                        title="מבצע הבא"
                                    >
                                        <Icon name="chevron-left" className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>

                            {/* CAROUSEL SLIDE ITEM */}
                            <div className="relative">
                                {saleProducts.map((prod, idx) => {
                                    if (idx !== (currentSaleSlide % saleProducts.length)) return null;
                                    const discountPct = Math.round(((prod.pricePerKg - prod.salePricePerKg) / prod.pricePerKg) * 100);
                                    const cert = kashrutCerts.find(k => k.name.includes(prod.kosherName) || prod.kosherName.includes(k.authority));

                                                <span className="absolute top-3 right-3 bg-rose-600 text-white font-black px-3 py-1 rounded-full text-xs shadow-md">
                                                    מבצע ({discountPct}%-)

                                            </div>

                                            <div className="md:col-span-2 space-y-4 text-right">
                                                <div>
                                                    <div className="flex items-center space-x-2 space-x-reverse mb-1">
                                                        <span className="bg-wolt-500/20 text-wolt-300 px-2.5 py-0.5 rounded-full text-[11px] font-bold">
                                                            {prod.category}
                                                        </span>
                                                        <span className="text-slate-400 font-mono text-xs">נתח #{prod.cutNumber}</span>
                                                    </div>
                                                    <h4 className="text-xl sm:text-2xl font-black text-white">{prod.name}</h4>
                                                    <p className="text-slate-300 font-bold text-xs mt-1">
                                                        כשרות: {prod.kosherName}
                                                    </p>
                                                </div>

                                                <div className="flex items-center space-x-4 space-x-reverse font-mono">
                                                    <div>
                                                        <span className="text-xs text-slate-400 font-sans block font-bold">מחיר מיוחד במבצע:</span>
                                                        <div className="flex items-baseline space-x-2 space-x-reverse">
                                                            <span className="text-2xl sm:text-3xl font-black text-rose-400">₪{prod.salePricePerKg}</span>
                                                            <span className="line-through text-slate-400 text-sm">₪{prod.pricePerKg}</span>
                                                            <span className="text-slate-400 text-xs font-sans">/ ק"ג</span>
                                                        </div>
                                                    </div>
                                                    <div className="mr-auto">

                                                                <button onClick={() => updateCartQuantity(prod.id, -5)} className="w-8 h-8 bg-slate-600 text-white rounded-full font-black flex items-center justify-center">

                                                            >
                                                                <Icon name="plus" className="w-4 h-4" />
                                                                <span>הוסף מוצר מבצע לסל</span>

                                                    </div>
