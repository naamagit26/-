                        <div className="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-5">
                            {filteredProducts.map(prod => {
                                const discountPct = prod.isOnSale ? Math.round(((prod.pricePerKg - prod.salePricePerKg) / prod.pricePerKg) * 100) : 0;
                                const cert = kashrutCerts.find(k => 
                                    k.name === prod.kosherName || 
                                    k.authority === prod.kosherName ||
                                    k.name.includes(prod.kosherName) || 
                                    prod.kosherName.includes(k.name) ||
                                    k.authority.includes(prod.kosherName) || 
                                    prod.kosherName.includes(k.authority)
                                ) || {
                                    id: 'cert_' + prod.id,
                                    name: `תעודת כשרות - ${prod.kosherName}`,
                                    authority: prod.kosherName,
                                    expiryDate: '2028-12-31',
                                    imageUrl: 'https://placehold.co/600x800/f8fafc/0f172a?text=' + encodeURIComponent('תעודת כשרות ' + prod.kosherName)
                                };
                                const inCartItem = cart.find(i => i.id === prod.id);

                                return (
                                    <div key={prod.id} className={`bg-white rounded-3xl border shadow-sm overflow-hidden flex flex-col justify-between transition hover:shadow-md ${prod.isOnSale ? 'border-rose-300' : 'border-slate-200'}`}>
                                        <div>
                                            <div className="relative h-44 bg-slate-100">
                                                <img src={prod.imageUrl} className="w-full h-full object-cover" />
                                                {prod.isOnSale && (
                                                    <span className="absolute top-3 right-3 bg-rose-600 text-white font-black px-3 py-1 rounded-full text-xs shadow">
                                                        מבצע ({discountPct}%-)
                                                    </span>
                                                )}
                                                {prod.stockKg <= 0 && (
                                                    <div className="absolute inset-0 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center text-white font-black text-sm">
                                                        אזל המלאי
                                                    </div>
                                                )}
                                            </div>

                                            <div className="p-4 space-y-2">
                                                <div className="flex justify-between items-start">
                                                    <h4 className="font-black text-slate-900 text-base">{prod.name}</h4>
                                                    <span className="text-slate-400 font-mono text-xs">#{prod.cutNumber}</span>
                                                </div>

                                                {/* KOSHER CLICKABLE BADGE WITH POPUP */}
                                                <button 
                                                    onClick={() => setSelectedKosherCert(cert)}
                                                    className="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 px-3 py-1.5 rounded-full text-[11px] font-black flex items-center space-x-1.5 space-x-reverse transition cursor-pointer shadow-xs active:scale-95"
                                                    title="לחץ לצפייה בתעודת הכשרות והפרטים"
                                                >
                                                    <Icon name="check" className="w-3.5 h-3.5 text-emerald-600" />
                                                    <span>📜 כשרות: {prod.kosherName} 🔍</span>
                                                </button>

                                                {prod.stockKg > 0 && prod.stockKg <= 20 && (
                                                    <span className="text-amber-600 font-black text-[11px] block">
                                                        ⚠️ מלאי נמוך! נותרו {prod.stockKg} ק"ג בלבד
                                                    </span>
                                                )}
                                            </div>
                                        </div>

                                        <div className="p-4 border-t border-slate-100 flex justify-between items-center bg-slate-50">
                                            <div className="font-mono">
                                                {prod.isOnSale ? (
                                                    <div className="flex items-center space-x-1.5 space-x-reverse">
                                                        <span className="font-black text-rose-600 text-lg">₪{prod.salePricePerKg}</span>
                                                        <span className="line-through text-slate-400 text-xs">₪{prod.pricePerKg}</span>
                                                    </div>
                                                ) : (
                                                    <span className="font-black text-slate-900 text-lg">₪{prod.pricePerKg}</span>
                                                )}
                                                <span className="text-slate-400 text-[10px] block font-sans font-bold">לקילוגרם</span>
                                            </div>

                                            {inCartItem ? (
                                                <div className="flex items-center bg-wolt-50 rounded-full border border-wolt-200 p-1">
                                                    <button onClick={() => updateCartQuantity(prod.id, -5)} className="w-7 h-7 bg-white text-wolt-600 rounded-full font-black flex items-center justify-center shadow-xs">
                                                        <Icon name="minus" className="w-3.5 h-3.5" />
                                                    </button>
                                                    <span className="px-2 font-mono font-black text-wolt-700 text-xs">{inCartItem.weightKg} ק"ג</span>
                                                    <button onClick={() => updateCartQuantity(prod.id, 5)} className="w-7 h-7 bg-wolt-500 text-white rounded-full font-black flex items-center justify-center shadow-xs">
                                                        <Icon name="plus" className="w-3.5 h-3.5" />
                                                    </button>
                                                </div>
                                            ) : (
                                                <button 
                                                    onClick={() => addToCart(prod)}
                                                    disabled={prod.stockKg <= 0}
                                                    className="bg-wolt-500 hover:bg-wolt-600 disabled:bg-slate-300 text-white font-black px-4 py-2.5 rounded-full shadow transition text-xs flex items-center space-x-1 space-x-reverse"
                                                >
                                                    <Icon name="plus" className="w-4 h-4" />
                                                    <span>הוסף לסל</span>
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {/* SIDEBAR CART PANEL (VISIBLE ON SIDE, DOES NOT COVER CATALOG) */}
                        <div className="lg:col-span-1 sticky top-20 space-y-4">
                            <div className="bg-slate-900 text-white p-5 rounded-3xl shadow-xl space-y-4 border border-slate-800">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="font-black text-base flex items-center space-x-2 space-x-reverse">
                                        <Icon name="shopping-bag" className="w-5 h-5 text-wolt-500" />
                                        <span>עגלת הקניות שלך ({cart.length})</span>
                                    </h3>
                                    {cart.length > 0 && (
                                        <button onClick={() => setCart([])} className="text-slate-400 hover:text-rose-400 text-[11px] font-bold">
                                            רוקן סל
                                        </button>
                                    )}
                                </div>

                                {cart.length === 0 ? (
                                    <div className="py-8 text-center text-slate-400 space-y-2">
                                        <Icon name="shopping-bag" className="w-10 h-10 mx-auto text-slate-600" />
                                        <p className="font-bold text-xs">הסל שלך ריק כרגע</p>
                                        <p className="text-[11px] text-slate-500">לחץ על "הוסף לסל" במוצרים משמאל כדי להרכיב את ההזמנה</p>
                                    </div>
                                ) : (
                                    <>
                                        <div className="space-y-2.5 max-h-[320px] overflow-y-auto pr-1">
                                            {cart.map(item => (
                                                <div key={item.id} className="bg-slate-800/90 p-3 rounded-2xl flex items-center justify-between space-x-2 space-x-reverse">
                                                    <div className="space-y-0.5 flex-1 min-w-0">
                                                        <div className="font-black text-xs text-white truncate">{item.name}</div>
                                                        <div className="text-[11px] text-slate-400 font-mono">
                                                            ₪{item.isOnSale ? item.salePricePerKg : item.pricePerKg} / ק"ג
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center space-x-1.5 space-x-reverse">
                                                        <div className="flex items-center bg-slate-700 rounded-xl p-1">
                                                            <button onClick={() => updateCartQuantity(item.id, -5)} className="w-5 h-5 bg-slate-600 hover:bg-slate-500 text-white rounded-lg flex items-center justify-center font-black">
                                                                -
                                                            </button>
                                                            <span className="px-2 font-mono font-black text-xs text-wolt-400">{item.weightKg}ק"ג</span>
                                                            <button onClick={() => updateCartQuantity(item.id, 5)} className="w-5 h-5 bg-wolt-500 hover:bg-wolt-600 text-white rounded-lg flex items-center justify-center font-black">
                                                                +
                                                            </button>
                                                        </div>
                                                        <button onClick={() => removeFromCart(item.id)} className="p-1 text-slate-400 hover:text-rose-400" title="הסר">
                                                            <Icon name="trash" className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="space-y-3 pt-3 border-t border-slate-800">
                                            <div>
                                                <label className="text-slate-400 font-bold block mb-1 text-[11px]">תאריך אספקה מבוקש:</label>
                                                <input 
                                                    type="date"
                                                    value={requestedDeliveryDate}
                                                    onChange={e => setRequestedDeliveryDate(e.target.value)}
                                                    className="w-full bg-slate-800 border border-slate-700 text-white p-2 rounded-xl text-xs font-bold font-mono"
                                                />
                                            </div>

                                            <div>
                                                <label className="text-slate-400 font-bold block mb-1 text-[11px]">הערות לנהג / לקיצוץ מיוחד:</label>
                                                <input 
                                                    type="text"
                                                    placeholder="הוראות פריקה, חיתוך וכו'..."
                                                    value={deliveryNotes}
                                                    onChange={e => setDeliveryNotes(e.target.value)}
                                                    className="w-full bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl text-xs font-bold"
                                                />
                                            </div>

                                            <div className="bg-slate-800 p-3 rounded-2xl flex justify-between items-center font-mono font-black">
                                                <span className="text-xs text-slate-300 font-sans">סה"כ משקל: {totalWeight} ק"ג</span>
                                                <span className="text-lg text-wolt-400">₪{totalAmount.toLocaleString()}</span>
                                            </div>

                                            <button 
                                                onClick={handleCheckout}
                                                className="w-full bg-wolt-500 hover:bg-wolt-600 text-white font-black py-3.5 rounded-2xl shadow-lg transition text-xs flex items-center justify-center space-x-2 space-x-reverse"
                                            >
                                                <span>אישור ושליחת הזמנה לליקוט</span>
                                                <Icon name="chevron-left" className="w-4 h-4" />
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* KASHRUT POPUP MODAL */}
                    {selectedKosherCert && (
                        <KashrutPopupModal cert={selectedKosherCert} onClose={() => setSelectedKosherCert(null)} />
                    )}
                </div>
            );
        }

        // --- PRINT & POPUP MODALS ---
        function KashrutPopupModal({ cert, onClose }) {
            return (
                <div className="fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-xs flex items-center justify-center p-4 dir-rtl text-xs">
                    <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative border border-slate-100 animate-in fade-in zoom-in duration-200">
                        <button onClick={onClose} className="absolute top-4 left-4 p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full font-bold transition">
                            ✕
                        </button>
                        
                        <div className="flex items-center space-x-3 space-x-reverse border-b border-slate-100 pb-3">
                            <div className="p-3 bg-emerald-50 text-emerald-700 rounded-2xl">
                                <Icon name="file-text" className="w-6 h-6" />
                            </div>
                            <div>
                                <span className="bg-emerald-100 text-emerald-800 font-black text-[10px] px-2.5 py-0.5 rounded-full inline-block mb-1">תעודת כשרות בתוקף</span>
                                <h3 className="font-black text-slate-900 text-lg leading-tight">{cert.name}</h3>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200 font-bold">
                            <div>
                                <span className="text-slate-400 text-[11px] block">גוף מעניק הכשרות:</span>
                                <span className="text-slate-900 font-black text-xs">{cert.authority || cert.name}</span>
                            </div>
                            <div>
                                <span className="text-slate-400 text-[11px] block">תוקף התעודה:</span>
                                <span className="text-emerald-700 font-black text-xs font-mono">{cert.expiryDate || 'בתוקף עד 2028'}</span>
                            </div>
                        </div>

                        <div className="rounded-2xl overflow-hidden border border-slate-200 bg-slate-900 shadow-inner flex items-center justify-center min-h-[280px] max-h-[60vh]">
                            <img src={cert.imageUrl} alt={cert.name} className="w-full h-full object-contain max-h-[55vh]" />
                        </div>

                        <button 
                            onClick={onClose}
                            className="w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-3 rounded-2xl transition text-xs shadow-md"
                        >
                            סגור תעודה
                        </button>
                    </div>
                </div>
            );
        }

        function SettingsModal({ settings, onSave, onClose }) {
            const [companyName, setCompanyName] = useState(settings.companyName);
            const [logoUrl, setLogoUrl] = useState(settings.logoUrl);
            const [whatsappPhone, setWhatsappPhone] = useState(settings.whatsappPhone);

            const handleLogoFile = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setLogoUrl(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({ companyName, logoUrl, whatsappPhone });
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4 dir-rtl text-xs">
                    <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl relative">
                        <button onClick={onClose} className="absolute top-4 left-4 p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full font-bold">
                            ✕
                        </button>
                        <h3 className="font-black text-slate-900 text-lg">הגדרות מותג וחברה</h3>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="font-bold text-slate-700 block mb-1">שם החברה / עסק:</label>
                                <input type="text" value={companyName} onChange={e => setCompanyName(e.target.value)} required className="w-full border p-2.5 rounded-xl font-bold bg-slate-50" />
                            </div>
                            <div>
                                <label className="font-bold text-slate-700 block mb-1">מספר WhatsApp עסקי ראשי:</label>
                                <input type="text" value={whatsappPhone} onChange={e => setWhatsappPhone(e.target.value)} required className="w-full border p-2.5 rounded-xl font-bold bg-slate-50 font-mono" />
                            </div>
                            <div>
                                <label className="font-bold text-slate-700 block mb-1">לוגו החברה (העלאת קובץ או URL):</label>
                                <input type="file" accept="image/*" onChange={handleLogoFile} className="w-full text-xs text-slate-500 mb-2" />
                                <input type="text" value={logoUrl} onChange={e => setLogoUrl(e.target.value)} placeholder="קישור URL לתמונה..." className="w-full border p-2.5 rounded-xl font-bold bg-slate-50 text-xs" />
                                {logoUrl && (
                                    <div className="mt-2 flex items-center space-x-2 space-x-reverse">
                                        <img src={logoUrl} className="w-12 h-12 object-cover rounded-xl border" />
                                        <span className="text-slate-500 text-[11px] font-bold">תצוגה מקדימה ללוגו</span>
                                    </div>
                                )}
                            </div>
                            <div className="flex gap-2 pt-2">
                                <button type="submit" className="flex-1 bg-wolt-500 hover:bg-wolt-600 text-white font-black py-3 rounded-xl text-xs shadow">
                                    שמור שינויים
                                </button>
                                <button type="button" onClick={onClose} className="px-4 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-xl text-xs">
                                    ביטול
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function PicklistPrintModal({ orders, products, drivers, customers, date, region, onClose }) {
            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4 dir-rtl text-xs">
                    <div className="bg-white rounded-3xl max-w-3xl w-full p-6 space-y-5 shadow-2xl relative max-h-[90vh] overflow-y-auto printable-card">
                        <div className="flex justify-between items-center no-print">
                            <h3 className="font-black text-slate-900 text-lg">דוח ליקוט יומי ואספקה</h3>
                            <div className="flex items-center space-x-2 space-x-reverse">
                                <button onClick={handlePrint} className="bg-wolt-500 text-white font-black px-4 py-2 rounded-xl">
                                    הדפס דוח 🖨️
                                </button>
                                <button onClick={onClose} className="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full font-bold">
                                    ✕
                                </button>
                            </div>
                        </div>

                        <div className="border-b pb-3">
                            <h2 className="text-xl font-black text-slate-900">דוח ליקוט מרוכז ליום: {date}</h2>
                            <p className="text-slate-500 font-bold">אזור חלוקה: {region} • סה"כ הזמנות: {orders.length}</p>
                        </div>

                        <div className="space-y-4">
                            {orders.map(ord => {
                                const cust = customers.find(c => c.id === ord.customerId);
                                return (
                                    <div key={ord.id} className="border p-4 rounded-2xl space-y-2 bg-slate-50">
                                        <div className="flex justify-between font-black text-slate-900 text-sm border-b pb-2">
                                            <span>{ord.customerName} ({ord.id})</span>
                                            <span>איש קשר: {cust?.contactName} | טלפון: {cust?.phone}</span>
                                        </div>
                                        <div className="text-slate-600 font-bold text-xs">כתובת: {cust?.deliveryAddress}</div>
                                        <div className="space-y-1 font-mono text-xs font-bold pt-1">
                                            {ord.items.map((it, idx) => (
                                                <div key={idx} className="flex justify-between border-t border-slate-200 pt-1">
                                                    <span>{it.name}</span>
                                                    <span>{it.weightKg} ק"ג</span>
                                                </div>
                                            ))}
                                        </div>
                                        {ord.notes && <div className="text-amber-700 text-[11px] font-bold bg-amber-50 p-2 rounded-xl">הערות: {ord.notes}</div>}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function QuotePrintModal({ customer, products, companySettings, onClose }) {
            const [selectedProducts, setSelectedProducts] = useState([
                { ...products[0], weightKg: 20 },
                { ...products[1], weightKg: 10 }
            ]);

            const total = selectedProducts.reduce((sum, p) => sum + ((p.isOnSale ? p.salePricePerKg : p.pricePerKg) * p.weightKg), 0);

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4 dir-rtl text-xs">
                    <div className="bg-white rounded-3xl max-w-2xl w-full p-6 space-y-4 shadow-2xl relative max-h-[90vh] overflow-y-auto printable-card">
                        <div className="flex justify-between items-center no-print border-b pb-3">
                            <h3 className="font-black text-slate-900 text-base">הפקת הצעת מחיר רשמית</h3>
                            <div className="flex items-center space-x-2 space-x-reverse">
                                <button onClick={() => window.print()} className="bg-wolt-500 text-white font-black px-4 py-2 rounded-xl">
                                    הדפס PDF 🖨️
                                </button>
                                <button onClick={onClose} className="p-2 bg-slate-100 text-slate-700 rounded-full font-bold">
                                    ✕
                                </button>
                            </div>
                        </div>

                        <div className="space-y-4">
                            <div className="flex justify-between items-center border-b pb-4">
                                <div>
                                    <h2 className="text-xl font-black text-slate-900">{companySettings.companyName}</h2>
                                    <p className="text-slate-500 font-bold">הצעת מחיר רשמית ללקוח</p>
                                </div>
                                <img src={companySettings.logoUrl} className="w-12 h-12 rounded-xl border" />
                            </div>

                            <div className="bg-slate-50 p-3 rounded-xl border text-slate-800 font-bold space-y-1">
                                <div>לכבוד: {customer.businessName} (ח.פ: {customer.taxId})</div>
                                <div>איש קשר: {customer.contactName} | טלפון: {customer.phone}</div>
                                <div>תאריך: {new Date().toISOString().split('T')[0]}</div>
                            </div>

                            <table className="w-full text-right border font-bold">
                                <thead className="bg-slate-100 border-b">
                                    <tr>
                                        <th className="p-2">מוצר / נתח</th>
                                        <th className="p-2">כמות (ק"ג)</th>
                                        <th className="p-2">מחיר לק"ג</th>
                                        <th className="p-2">סה"כ</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {selectedProducts.map((p, i) => (
                                        <tr key={i} className="border-b">
                                            <td className="p-2 font-black">{p.name}</td>
                                            <td className="p-2 font-mono">{p.weightKg}</td>
                                            <td className="p-2 font-mono">₪{p.isOnSale ? p.salePricePerKg : p.pricePerKg}</td>
                                            <td className="p-2 font-mono font-black">₪{((p.isOnSale ? p.salePricePerKg : p.pricePerKg) * p.weightKg).toLocaleString()}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>

                            <div className="flex justify-end font-mono font-black text-base text-slate-900">
                                סה"כ לפני מע"מ: ₪{total.toLocaleString()}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- RENDER APPLICATION ---
        const rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.createRoot(rootElement).render(<App />);
        }
    </script>
</body>
</html>
