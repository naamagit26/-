            const [currentCompanyId, setCurrentCompanyId] = useState(() => localStorage.getItem('meat_current_company') || 'meat_b2b_default');
            
            const [users, setUsers] = useState(() => JSON.parse(localStorage.getItem('meat_users')) || INITIAL_USERS);
            const [currentUser, setCurrentUser] = useState(() => users[0]);
            
            const [activeTab, setActiveTab] = useState('pipeline'); // pipeline, customers, inactive, catalog, logistics, broadcast, staff, portal
            const [customers, setCustomers] = useState(() => JSON.parse(localStorage.getItem('meat_customers')) || INITIAL_CUSTOMERS);
            const [leads, setLeads] = useState(() => JSON.parse(localStorage.getItem('meat_leads')) || INITIAL_LEADS);
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('meat_products')) || INITIAL_PRODUCTS);
            const [kashrutCerts, setKashrutCerts] = useState(() => JSON.parse(localStorage.getItem('meat_kashrut')) || INITIAL_KASHRUT_CERTS);
            const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('meat_orders')) || INITIAL_ORDERS);
            const [drivers, setDrivers] = useState(() => JSON.parse(localStorage.getItem('meat_drivers')) || INITIAL_DRIVERS);

            const [selectedCustomerId, setSelectedCustomerId] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);
            const [settingsModalOpen, setSettingsModalOpen] = useState(false);
            const [showTenantModal, setShowTenantModal] = useState(false);

            const companySettings = useMemo(() => {
                return companies.find(c => c.id === currentCompanyId) || companies[0];
            }, [companies, currentCompanyId]);

            // Detect URL parameters for Portal or Company direct access
            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const compParam = urlParams.get('company');
                if (compParam) {
                    setCurrentCompanyId(compParam);
                }
                if (urlParams.get('portal') === 'true' || window.location.hash === '#portal' || urlParams.get('view') === 'portal') {
                    setActiveTab('portal');
                    const customerUser = users.find(u => u.role === 'customer') || { id: 'c_guest', name: 'לקוח B2B', role: 'customer' };
                    setCurrentUser(customerUser);
                }
            }, []);

            // Firebase Live Data Listener per Company
            useEffect(() => {
                if (!db || !currentCompanyId) return;

                const compRef = db.collection('companies').doc(currentCompanyId);

                const unsubProducts = compRef.collection('products').onSnapshot(snapshot => {
                    if (!snapshot.empty) setProducts(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubLeads = compRef.collection('leads').onSnapshot(snapshot => {
                    if (!snapshot.empty) setLeads(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubCustomers = compRef.collection('customers').onSnapshot(snapshot => {
                    if (!snapshot.empty) setCustomers(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const unsubOrders = compRef.collection('orders').onSnapshot(snapshot => {
                    if (!snapshot.empty) setOrders(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                return () => {
                    unsubProducts();
                    unsubLeads();
                    unsubCustomers();
                    unsubOrders();
                };
            }, [currentCompanyId]);

            useEffect(() => { localStorage.setItem('meat_companies', JSON.stringify(companies)); }, [companies]);

            useEffect(() => { localStorage.setItem('meat_users', JSON.stringify(users)); }, [users]);
            useEffect(() => { localStorage.setItem('meat_customers', JSON.stringify(customers)); }, [customers]);
            useEffect(() => { localStorage.setItem('meat_leads', JSON.stringify(leads)); }, [leads]);
            useEffect(() => { localStorage.setItem('meat_products', JSON.stringify(products)); }, [products]);
            useEffect(() => { localStorage.setItem('meat_kashrut', JSON.stringify(kashrutCerts)); }, [kashrutCerts]);
            useEffect(() => { localStorage.setItem('meat_orders', JSON.stringify(orders)); }, [orders]);
            useEffect(() => { localStorage.setItem('meat_drivers', JSON.stringify(drivers)); }, [drivers]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const handleCompanySelect = (compId) => {
                setCurrentCompanyId(compId);
                showToast(`עברת לניהול חברת: ${companies.find(c => c.id === compId)?.companyName}`);

                showToast(`חברה חדשה "${name}" הוקמה בהצלחה!`);
