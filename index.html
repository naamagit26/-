<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שווק בשר B2B - מערכת ניהול ופורטל לקוחות</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts (Rubik) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background-color: #f8f6f2;
      color: #1e1e1e;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #c5a880;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #a3845c;
    }
  </style>
</head>
<body class="bg-[#f8f6f2] text-gray-900 antialiased selection:bg-[#c5a880] selection:text-white">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Lucide Icon Helper ---
    const Icon = ({ name, className = "w-5 h-5", size, ...props }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = '';
          const iconNode = window.lucide.icons[name];
          if (iconNode) {
            const svg = window.lucide.createIcons({
              icons: { [name]: iconNode },
              nameAttr: 'data-lucide'
            });
          }
        }
      }, [name]);
      return <i ref={iconRef} data-lucide={name} class={className} {...props}></i>;
    };

    // --- INITIAL CLEAN DATA (PRODUCTION READY) ---
    const INITIAL_LEADS = [];
    const INITIAL_CUSTOMERS = [];
    const INITIAL_ORDERS = [];

    const INITIAL_KASHRUT_CERTS = [
      {
        id: 'cert_1',
        name: 'בד"ץ העדה החרדית',
        authority: 'בד"ץ העדה החרדית ירושלים',
        expiryDate: '2027-12-31',
        imageUrl: 'https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'cert_2',
        name: 'הרב מחפוד - יורה דעה',
        authority: 'בד"ץ יורה דעה',
        expiryDate: '2027-10-30',
        imageUrl: 'https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?auto=format&fit=crop&w=600&q=80'
      }
    ];

    const INITIAL_PRODUCTS = [
      {
        id: 'p1',
        name: "כתף בקר מס 4 מיושן",
        category: 'בקר טרי',
        pricePerKg: 68,
        isOnSale: true,
        salePricePerKg: 58,
        kashrutId: 'cert_1',
        stockKg: 120,
        imageUrl: 'https://images.unsplash.com/photo-1603048588665-791ca8aea617?auto=format&fit=crop&w=600&q=80',
        description: 'נתח כתף בקר טרי מיושן באיכות פרימיום, מתאים לבישול ארוך וקדירות.'
      },
      {
        id: 'p2',
        name: "אנטריקוט בקר מוזן עלים",
        category: 'בקר טרי',
        pricePerKg: 145,
        isOnSale: false,
        salePricePerKg: null,
        kashrutId: 'cert_2',
        stockKg: 45,
        imageUrl: 'https://images.unsplash.com/photo-1558030006-450675393462?auto=format&fit=crop&w=600&q=80',
        description: 'נתח אנטריקוט משוייש בעל ארומה עשירה, מתאים לסטייקים וצליה.'
      },
      {
        id: 'p3',
        name: "צלעות טלה טריות",
        category: 'טלה וכבש',
        pricePerKg: 130,
        isOnSale: true,
        salePricePerKg: 110,
        kashrutId: 'cert_1',
        stockKg: 15,
        imageUrl: 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80',
        description: 'צלעות טלה טריות ואיכותיות עם שכבת שומן מעודנת.'
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [leads, setLeads] = useState(() => {
        const saved = localStorage.getItem('meat_b2b_v2_leads');
        return saved ? JSON.parse(saved) : INITIAL_LEADS;
      });

      const [customers, setCustomers] = useState(() => {
        const saved = localStorage.getItem('meat_b2b_v2_customers');
        return saved ? JSON.parse(saved) : INITIAL_CUSTOMERS;
      });

      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('meat_b2b_v2_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      const [kashrutCerts, setKashrutCerts] = useState(() => {
        const saved = localStorage.getItem('meat_b2b_v2_certs');
        return saved ? JSON.parse(saved) : INITIAL_KASHRUT_CERTS;
      });

      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('meat_b2b_v2_orders');
        return saved ? JSON.parse(saved) : INITIAL_ORDERS;
      });

      const [activeTab, setActiveTab] = useState('pipeline');
      const [selectedCertForModal, setSelectedCertForModal] = useState(null);
      const [selectedCustomerForFile, setSelectedCustomerForFile] = useState(null);

      // Check URL params for direct portal entry
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('portal') === 'true') {
          setActiveTab('portal');
        }
      }, []);

      // Save states
      useEffect(() => { localStorage.setItem('meat_b2b_v2_leads', JSON.stringify(leads)); }, [leads]);
      useEffect(() => { localStorage.setItem('meat_b2b_v2_customers', JSON.stringify(customers)); }, [customers]);
      useEffect(() => { localStorage.setItem('meat_b2b_v2_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('meat_b2b_v2_certs', JSON.stringify(kashrutCerts)); }, [kashrutCerts]);
      useEffect(() => { localStorage.setItem('meat_b2b_v2_orders', JSON.stringify(orders)); }, [orders]);

      // Move lead to pipeline status
      const handleMoveLead = (leadId, newStatus) => {
        setLeads(prev => prev.map(l => l.id === leadId ? { ...l, status: newStatus } : l));
      };

      // Handle Portal WhatsApp Link Send
      const handleSendPortalLink = (lead) => {
        const portalUrl = window.location.origin + window.location.pathname + '?portal=true';
        const msg = encodeURIComponent(`שלום ${lead.contactName}, מצורף הקישור לפורטל ההזמנות הישיר של שווק בשר B2B: ${portalUrl}`);
        window.open(`https://wa.me/972${lead.phone.replace(/[^0-9]/g, '').replace(/^0/, '')}?text=${msg}`, '_blank');
        handleMoveLead(lead.id, 'contacted');
      };

      return (
        <div class="min-h-screen flex flex-col bg-[#f8f6f2]">
          <!-- Header Navigation -->
          <header class="bg-white border-b border-stone-200 sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-red-700 text-white font-bold text-xl flex items-center justify-center shadow-md">
                    🥩
                  </div>
                  <div>
                    <h1 class="text-lg font-bold text-stone-900 leading-tight">שווק בשר פרימיום B2B</h1>
                    <p class="text-xs text-amber-700 font-medium">מערכת ניהול ופורטל לקוחות עסקיים</p>
                  </div>
                </div>

                <!-- Navigation Tabs -->
                <nav class="hidden md:flex items-center gap-1">
                  <button 
                    onClick={() => setActiveTab('pipeline')} 
                    class={`px-3 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'pipeline' ? 'bg-stone-900 text-white' : 'text-stone-600 hover:bg-stone-100'}`}
                  >
                    צנרת לידים
                  </button>
                  <button 
                    onClick={() => setActiveTab('catalog')} 
                    class={`px-3 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'catalog' ? 'bg-stone-900 text-white' : 'text-stone-600 hover:bg-stone-100'}`}
                  >
                    ניהול קטלוג וכשרות
                  </button>
                  <button 
                    onClick={() => setActiveTab('portal')} 
                    class={`px-3 py-2 rounded-lg text-sm font-semibold transition bg-red-50 text-red-700 hover:bg-red-100 border border-red-200`}
                  >
                    תצוגת פורטל לקוחות ↗
                  </button>
                </nav>
              </div>
            </div>
          </header>

          <!-- Main Content Body -->
          <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            {activeTab === 'pipeline' && (
              <div>
                <div class="flex justify-between items-center mb-6">
                  <div>
                    <h2 class="text-2xl font-bold text-stone-900">צנרת לידים ומכירות (Sales Pipeline)</h2>
                    <p class="text-sm text-stone-500">מעקב וניהול לידים פוטנציאליים בזמן אמת</p>
                  </div>
                  <button 
                    onClick={() => {
                      const name = prompt('שם העסק / הלקוח החדש:');
                      const phone = prompt('מספר טלפון:');
                      const contactName = prompt('שם איש קשר:');
                      if (name && phone) {
                        const newLead = {
                          id: 'lead_' + Date.now(),
                          name,
                          phone,
                          contactName: contactName || 'איש קשר',
                          type: 'מסעדה / קצבייה',
                          city: 'מרכז',
                          status: 'new'
                        };
                        setLeads(prev => [newLead, ...prev]);
                      }
                    }}
                    class="px-4 py-2 bg-red-700 text-white rounded-xl font-bold hover:bg-red-800 transition shadow"
                  >
                    + הוסף ליד חדש
                  </button>
                </div>

                {leads.length === 0 ? (
                  <div class="bg-white border-2 border-dashed border-stone-200 rounded-2xl p-12 text-center">
                    <p class="text-stone-500 font-medium text-lg">אין כרגע לידים במערכת.</p>
                    <p class="text-stone-400 text-sm mt-1">לחצי על "+ הוסף ליד חדש" כדי להתחיל להזין לקוחות חדשים.</p>
                  </div>
                ) : (
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {/* Status Columns */}
                    {['new', 'contacted', 'active'].map((statusKey) => {
                      const titles = { new: '1. חדש', contacted: '2. נוצר קשר', active: '3. לקוח פעיל' };
                      const filteredLeads = leads.filter(l => l.status === statusKey);
                      return (
                        <div key={statusKey} class="bg-stone-100 rounded-2xl p-4 border border-stone-200">
                          <h3 class="font-bold text-stone-800 mb-3 flex items-center justify-between">
                            <span>{titles[statusKey]}</span>
                            <span class="bg-stone-200 px-2.5 py-0.5 rounded-full text-xs font-semibold">{filteredLeads.length}</span>
                          </h3>
                          <div class="space-y-3">
                            {filteredLeads.map(lead => (
                              <div key={lead.id} class="bg-white p-4 rounded-xl border border-stone-200 shadow-sm">
                                <h4 class="font-bold text-stone-900">{lead.name}</h4>
                                <p class="text-xs text-stone-500 mt-0.5">איש קשר: {lead.contactName} • {lead.phone}</p>
                                <div class="mt-3 flex items-center justify-between pt-3 border-t border-stone-100">
                                  {statusKey !== 'active' && (
                                    <button 
                                      onClick={() => handleSendPortalLink(lead)}
                                      class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1.5 rounded-lg font-semibold hover:bg-emerald-100 transition"
                                    >
                                      שלח קישור פורטל 💬
                                    </button>
                                  )}
                                  {statusKey === 'active' && (
                                    <span class="text-xs text-emerald-600 font-bold">✓ מחובר למערכת</span>
                                  )}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'catalog' && (
              <div>
                <h2 class="text-2xl font-bold text-stone-900 mb-6">ניהול קטלוג וכשרות</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {products.map(product => (
                    <div key={product.id} class="bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-sm">
                      <img src={product.imageUrl} class="w-full h-44 object-cover" alt={product.name} />
                      <div class="p-4">
                        <h3 class="font-bold text-stone-900 text-lg">{product.name}</h3>
                        <p class="text-xs text-stone-500 mt-1">{product.description}</p>
                        <div class="mt-4 flex items-center justify-between">
                          <div>
                            <span class="text-xl font-extrabold text-stone-900">₪{product.isOnSale ? product.salePricePerKg : product.pricePerKg}</span>
                            <span class="text-xs text-stone-500"> / ק"ג</span>
                          </div>
                          <span class="text-xs font-semibold px-2 py-1 rounded bg-stone-100 border border-stone-200">
                            מלאי: {product.stockKg} ק"ג
                          </span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'portal' && (
              <div class="space-y-6">
                {/* Promotional Carousel */}
                <div class="bg-gradient-to-r from-red-800 to-red-950 rounded-3xl p-6 text-white shadow-xl">
                  <div class="flex items-center justify-between">
                    <div>
                      <span class="bg-amber-400 text-stone-950 font-black text-xs px-3 py-1 rounded-full uppercase tracking-wider">
                        מבצעי השבוע מיוחדים
                      </span>
                      <h2 class="text-3xl font-extrabold mt-2">נתחי בקר פרימיום במחירי יבואן</h2>
                      <p class="text-red-100 text-sm mt-1">אספקה קירור ישירה לעסק שלך עד 24 שעות</p>
                    </div>
                  </div>
                </div>

                {/* Catalog & Sidebar Layout */}
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                  {/* Products Grid */}
                  <div class="lg:col-span-2 space-y-4">
                    <h3 class="text-xl font-bold text-stone-900">קטלוג נתחים זמינים אספקה מיידית</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {products.map(product => (
                        <div key={product.id} class="bg-white rounded-2xl p-4 border border-stone-200 shadow-sm flex flex-col justify-between">
                          <div>
                            <img src={product.imageUrl} class="w-full h-36 object-cover rounded-xl mb-3" />
                            <h4 class="font-bold text-stone-900">{product.name}</h4>
                            <p class="text-xs text-stone-500 mt-1 line-clamp-2">{product.description}</p>
                          </div>
                          <div class="mt-4 pt-3 border-t border-stone-100 flex items-center justify-between">
                            <div>
                              <span class="text-lg font-bold text-red-700">₪{product.isOnSale ? product.salePricePerKg : product.pricePerKg}</span>
                              <span class="text-xs text-stone-500"> / ק"ג</span>
                            </div>
                            <button class="bg-stone-900 text-white text-xs font-bold px-3 py-2 rounded-xl hover:bg-stone-800 transition">
                              + הוסף לסל
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Cart Sidebar */}
                  <div class="lg:col-span-1">
                    <div class="bg-white rounded-3xl p-5 border border-stone-200 shadow-md sticky top-20">
                      <h3 class="text-lg font-bold text-stone-900 mb-4 pb-2 border-b border-stone-100">🛒 סל הזמנות עסקי</h3>
                      <div class="py-8 text-center text-stone-400 text-sm">
                        הסל שלך ריק כרגע.
                      </div>
                      <button class="w-full bg-stone-300 text-stone-600 font-bold py-3 rounded-2xl text-sm cursor-not-allowed">
                        שלח הזמנה למשווק
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
